name: Build

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install bikeshed && bikeshed update
      - run: bikeshed --die-on=warning spec index.bs index.html
      - name: Commit built index.html back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add index.html
          if git diff --cached --quiet -- index.html; then
            echo "index.html unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Build index.html from index.bs [skip ci]"
          git push
